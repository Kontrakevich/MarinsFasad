name: Brand Apply Studio MVP

on:
  push:
    branches:
      - brand-apply-studio-bootstrap
    paths:
      - "brand-apply-studio/**"
      - ".github/workflows/brand-apply-studio.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand-apply-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall app

      - name: Import application
        run: python -c "from app.main import app; print(app.title, app.version)"
